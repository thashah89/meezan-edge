[theme]
base            = "dark"
primaryColor    = "#00C49F"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1e2130"
textColor       = "#e0e0e0"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
